name: Keep-alive

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API and database
        run: curl -fsS --retry 5 --retry-all-errors --retry-delay 20 --max-time 90 https://ai-website-backend-4atj.onrender.com/healthz
