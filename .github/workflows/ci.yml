name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'assets/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'assets/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gensite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gensite_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Server — typecheck & test
        working-directory: server
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npx tsc -p tsconfig.tooling.json
          npm test
          npm run test:integration

      - name: Client — lint & typecheck
        working-directory: client
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npx tsc --noEmit -p tsconfig.app.json
