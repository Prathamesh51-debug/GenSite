<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="898" height="418" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="40" y="56" font-size="12" letter-spacing="2" font-weight="700" fill="#64748b">GENERATION PIPELINE v2</text>
  <text x="40" y="90" font-size="26" font-weight="800" fill="#0f172a">One prompt &#8594; one coherent page</text>
  <text x="40" y="116" font-size="14" fill="#475569">Streamed over SSE, guarded at every step, with credits charged atomically and refunded on failure.</text>

  <!-- nodes -->
  <g>
    <rect x="40" y="150" width="148" height="96" rx="14" fill="#ffffff" stroke="#e6edf3"/>
    <circle cx="62" cy="176" r="6" fill="#0d9488"/>
    <text x="78" y="181" font-size="14" font-weight="800" fill="#0f172a">Prompt</text>
    <text x="56" y="206" font-size="11.5" fill="#475569">tier: free or</text>
    <text x="56" y="223" font-size="11.5" fill="#475569">premium</text>

    <rect x="208" y="150" width="148" height="96" rx="14" fill="#ffffff" stroke="#e6edf3"/>
    <circle cx="230" cy="176" r="6" fill="#d97706"/>
    <text x="246" y="181" font-size="14" font-weight="800" fill="#0f172a">Enhance*</text>
    <text x="224" y="206" font-size="11.5" fill="#475569">vague prompt &#8594;</text>
    <text x="224" y="223" font-size="11.5" fill="#475569">design brief</text>

    <rect x="376" y="150" width="148" height="96" rx="14" fill="#ffffff" stroke="#e6edf3"/>
    <circle cx="398" cy="176" r="6" fill="#7c3aed"/>
    <text x="414" y="181" font-size="14" font-weight="800" fill="#0f172a">Generate</text>
    <text x="392" y="206" font-size="11.5" fill="#475569">single page,</text>
    <text x="392" y="223" font-size="11.5" fill="#475569">truncation-guarded</text>

    <rect x="544" y="150" width="148" height="96" rx="14" fill="#ffffff" stroke="#e6edf3"/>
    <circle cx="566" cy="176" r="6" fill="#0d9488"/>
    <text x="582" y="181" font-size="14" font-weight="800" fill="#0f172a">Images</text>
    <text x="560" y="206" font-size="11.5" fill="#475569">swap in Pexels</text>
    <text x="560" y="223" font-size="11.5" fill="#475569">stock photos</text>

    <rect x="712" y="150" width="148" height="96" rx="14" fill="#ffffff" stroke="#e6edf3"/>
    <circle cx="734" cy="176" r="6" fill="#16a34a"/>
    <text x="750" y="181" font-size="14" font-weight="800" fill="#0f172a">Stream</text>
    <text x="728" y="206" font-size="11.5" fill="#475569">save + version,</text>
    <text x="728" y="223" font-size="11.5" fill="#475569">SSE preview</text>
  </g>

  <!-- arrows -->
  <g fill="#cbd5e1" font-size="18" font-weight="800" text-anchor="middle">
    <text x="198" y="204">&#8594;</text>
    <text x="366" y="204">&#8594;</text>
    <text x="534" y="204">&#8594;</text>
    <text x="702" y="204">&#8594;</text>
  </g>

  <!-- guard strip -->
  <rect x="40" y="284" width="820" height="70" rx="14" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="60" y="310" font-size="12" letter-spacing="1.2" font-weight="700" fill="#0f766e">GUARDS &#38; BILLING</text>
  <text x="60" y="334" font-size="12.5" fill="#334155">free/premium routing&#160;&#160;·&#160;&#160;premium&#8594;free downgrade refund&#160;&#160;·&#160;&#160;atomic race-safe credits&#160;&#160;·&#160;&#160;auto-refund on failure</text>

  <text x="40" y="388" font-size="11" fill="#94a3b8">* Enhancement runs only when a prompt is vague, and always on a free model &#8212; your own words override the brief.</text>
</svg>
