<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="898" height="468" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="40" y="56" font-size="12" letter-spacing="2" font-weight="700" fill="#64748b">CLEAN ARCHITECTURE</text>
  <text x="40" y="90" font-size="26" font-weight="800" fill="#0f172a">Layered by design</text>
  <text x="40" y="116" font-size="14" fill="#475569">One folder per feature on the server, feature folders on the client &#8212; the HTTP layer never touches the DB.</text>

  <!-- SERVER panel -->
  <rect x="40" y="146" width="500" height="296" rx="16" fill="#ffffff" stroke="#e6edf3"/>
  <text x="64" y="176" font-size="13" letter-spacing="1.2" font-weight="800" fill="#0f172a">SERVER &#8212; one folder per feature</text>

  <rect x="64" y="190" width="372" height="40" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="80" y="208" font-size="13.5" font-weight="700" fill="#0f766e">routes</text>
  <text x="80" y="223" font-size="11" fill="#475569">HTTP: controllers + routes</text>
  <text x="250" y="245" font-size="13" fill="#94a3b8" text-anchor="middle">&#8595;</text>

  <rect x="64" y="250" width="372" height="40" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="80" y="268" font-size="13.5" font-weight="700" fill="#0f766e">services</text>
  <text x="80" y="283" font-size="11" fill="#475569">business rules / services</text>
  <text x="250" y="305" font-size="13" fill="#94a3b8" text-anchor="middle">&#8595;</text>

  <rect x="64" y="310" width="372" height="40" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="80" y="328" font-size="13.5" font-weight="700" fill="#0f766e">repositories</text>
  <text x="80" y="343" font-size="11" fill="#475569">Prisma repositories</text>
  <text x="250" y="365" font-size="13" fill="#94a3b8" text-anchor="middle">&#8595;</text>

  <rect x="64" y="370" width="372" height="40" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="80" y="388" font-size="13.5" font-weight="700" fill="#0f766e">schemas</text>
  <text x="80" y="403" font-size="11" fill="#475569">Zod schemas</text>

  <text x="64" y="430" font-size="11" fill="#64748b">Features: project · user · billing — plus generation · core · platform · shared</text>

  <!-- CLIENT panel -->
  <rect x="560" y="146" width="300" height="296" rx="16" fill="#ffffff" stroke="#e6edf3"/>
  <text x="584" y="176" font-size="13" letter-spacing="1.2" font-weight="800" fill="#0f172a">CLIENT &#8212; feature-based</text>

  <rect x="584" y="190" width="252" height="44" rx="10" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="600" y="210" font-size="13.5" font-weight="700" fill="#7c3aed">app/</text>
  <text x="600" y="226" font-size="11" fill="#475569">providers, routing</text>

  <rect x="584" y="244" width="252" height="44" rx="10" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="600" y="264" font-size="13.5" font-weight="700" fill="#7c3aed">pages/</text>
  <text x="600" y="280" font-size="11" fill="#475569">route screens</text>

  <rect x="584" y="298" width="252" height="44" rx="10" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="600" y="318" font-size="13.5" font-weight="700" fill="#7c3aed">features/</text>
  <text x="600" y="334" font-size="11" fill="#475569">auth · editor · billing</text>

  <rect x="584" y="352" width="252" height="44" rx="10" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="600" y="372" font-size="13.5" font-weight="700" fill="#7c3aed">shared/</text>
  <text x="600" y="388" font-size="11" fill="#475569">ui · lib · api</text>

  <text x="584" y="424" font-size="11" fill="#64748b">@/ alias imports throughout</text>
</svg>
