<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="898" height="448" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="40" y="56" font-size="12" letter-spacing="2" font-weight="700" fill="#64748b">PROJECT EVOLUTION · 74 COMMITS</text>
  <text x="40" y="90" font-size="26" font-weight="800" fill="#0f172a">How GenSite grew up</text>

  <!-- timeline spine -->
  <line x1="72" y1="140" x2="72" y2="418" stroke="#e2e8f0" stroke-width="3"/>

  <!-- Phase 1 -->
  <circle cx="72" cy="160" r="9" fill="#94a3b8"/>
  <text x="104" y="156" font-size="16" font-weight="800" fill="#0f172a">Jun 2026 &#8212; Base</text>
  <text x="104" y="178" font-size="13" fill="#475569">Tutorial-style starting point: multi-page app, Spline 3D hero, heavy animation libs. A 32-commit import.</text>

  <!-- Phase 2 -->
  <circle cx="72" cy="228" r="9" fill="#0d9488"/>
  <text x="104" y="224" font-size="16" font-weight="800" fill="#0f172a">Jul 2026 &#8212; Professional rebuild</text>
  <text x="104" y="246" font-size="13" fill="#475569">Feature modules (project / user / billing), a shared HTTP foundation, legal pages, CI, brand &#38; SEO.</text>

  <!-- Phase 3 -->
  <circle cx="72" cy="296" r="9" fill="#d97706"/>
  <text x="104" y="292" font-size="16" font-weight="800" fill="#0f172a">Jul&#8211;Aug 2026 &#8212; Trim the bloat</text>
  <text x="104" y="314" font-size="13" fill="#475569">Removed Spline + tsparticles / gsap / motion / ogl (&#8722;2,822 lines), dropped helmet, added a keep-alive worker.</text>

  <!-- Phase 4 -->
  <circle cx="72" cy="364" r="9" fill="#7c3aed"/>
  <text x="104" y="360" font-size="16" font-weight="800" fill="#0f172a">Aug 2026 &#8212; v2 architecture &#38; pipeline</text>
  <text x="104" y="382" font-size="13" fill="#475569">Layered restructure (50 server + 28 client files) + new generation: free/premium tiers, single-page, Pexels, enhancement.</text>

  <text x="40" y="426" font-size="11" fill="#94a3b8">From a tutorial clone to a lean, layered product.</text>
</svg>
