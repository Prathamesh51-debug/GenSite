<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="898" height="428" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="40" y="56" font-size="12" letter-spacing="2" font-weight="700" fill="#64748b">FRONTEND PERFORMANCE</text>
  <text x="40" y="90" font-size="26" font-weight="800" fill="#0f172a">Cutting the fat</text>
  <text x="40" y="116" font-size="14" fill="#475569">Stripped the tutorial-era eye-candy for a lighter bundle and lower GPU load on weak devices.</text>

  <!-- KPI cards -->
  <rect x="40" y="146" width="260" height="104" rx="14" fill="#ffffff" stroke="#e6edf3"/>
  <text x="60" y="192" font-size="34" font-weight="800" fill="#0d9488">&#8722;2,822</text>
  <text x="60" y="218" font-size="13" font-weight="600" fill="#334155">lines removed</text>
  <text x="60" y="238" font-size="11" fill="#94a3b8">hero effects + animation libs</text>

  <rect x="320" y="146" width="260" height="104" rx="14" fill="#ffffff" stroke="#e6edf3"/>
  <text x="340" y="192" font-size="34" font-weight="800" fill="#d97706">7</text>
  <text x="340" y="218" font-size="13" font-weight="600" fill="#334155">npm packages cut</text>
  <text x="340" y="238" font-size="11" fill="#94a3b8">plus the Spline 3D engine</text>

  <rect x="600" y="146" width="260" height="104" rx="14" fill="#ffffff" stroke="#e6edf3"/>
  <text x="620" y="192" font-size="34" font-weight="800" fill="#7c3aed">0</text>
  <text x="620" y="218" font-size="13" font-weight="600" fill="#334155">deps for security headers</text>
  <text x="620" y="238" font-size="11" fill="#94a3b8">helmet &#8594; hand-rolled</text>

  <!-- removed chips -->
  <text x="40" y="288" font-size="11" letter-spacing="1.2" font-weight="700" fill="#94a3b8">REMOVED FROM THE FRONTEND</text>

  <g font-size="12.5" font-weight="600" fill="#b91c1c">
    <rect x="40" y="300" width="118" height="28" rx="14" fill="#fef2f2" stroke="#fecaca"/><text x="58" y="318">&#215;&#160;@splinetool</text>
    <rect x="168" y="300" width="168" height="28" rx="14" fill="#fef2f2" stroke="#fecaca"/><text x="186" y="318">&#215;&#160;@tsparticles/engine</text>
    <rect x="346" y="300" width="160" height="28" rx="14" fill="#fef2f2" stroke="#fecaca"/><text x="364" y="318">&#215;&#160;@tsparticles/react</text>
    <rect x="516" y="300" width="156" height="28" rx="14" fill="#fef2f2" stroke="#fecaca"/><text x="534" y="318">&#215;&#160;@tsparticles/slim</text>

    <rect x="40" y="338" width="78" height="28" rx="14" fill="#fef2f2" stroke="#fecaca"/><text x="58" y="356">&#215;&#160;gsap</text>
    <rect x="128" y="338" width="92" height="28" rx="14" fill="#fef2f2" stroke="#fecaca"/><text x="146" y="356">&#215;&#160;motion</text>
    <rect x="230" y="338" width="72" height="28" rx="14" fill="#fef2f2" stroke="#fecaca"/><text x="248" y="356">&#215;&#160;ogl</text>
    <rect x="312" y="338" width="128" height="28" rx="14" fill="#fef2f2" stroke="#fecaca"/><text x="330" y="356">&#215;&#160;@types/three</text>
    <rect x="450" y="338" width="86" height="28" rx="14" fill="#fef2f2" stroke="#fecaca"/><text x="468" y="356">&#215;&#160;helmet</text>
  </g>

  <text x="40" y="400" font-size="11" fill="#94a3b8">Kept lean: CSS/Tailwind animation only, hand-set security headers, Lenis for smooth scroll.</text>
</svg>
